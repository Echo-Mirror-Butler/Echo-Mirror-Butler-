name: Security · Vulnerability Scan

on:
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3am

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      scan-args: |-
        --lockfile=pubspec.lock

  hardcoded-secret-guard:
    name: Fail on hardcoded fallback secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject hardcoded default secrets in edge functions
        run: |
          set -euo pipefail
          # Fail if any Deno.env.get(...) uses a hardcoded string fallback.
          # Regression guard for the unsubscribe-digest default-secret bug.
          if grep -RInE "Deno\.env\.get\([^)]*\)\s*\?\?\s*['\"][^'\"]+['\"]" supabase/functions; then
            echo "::error::Hardcoded fallback secret detected in supabase/functions. Remove the '?? \"...\"' default and fail loudly when the env var is missing."
            exit 1
          fi
          echo "No hardcoded fallback secrets found."
