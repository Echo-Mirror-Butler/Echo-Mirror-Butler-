name: Security · Vulnerability Scan

on:
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3am

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OSV Scanner (Flutter app)
        uses: google/osv-scanner-action@v2.3.3
        with:
          scan-args: |-
            --lockfile=pubspec.lock

      - name: Run OSV Scanner (Serverpod server)
        uses: google/osv-scanner-action@v2.3.3
        with:
          scan-args: |-
            --lockfile=echomirror_server/echomirror_server_server/pubspec.lock
