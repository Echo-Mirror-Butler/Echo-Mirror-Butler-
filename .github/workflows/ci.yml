name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  supabase-db-tests:
    name: Supabase DB Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup

  flutter-ci:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Only format Flutter/Dart app files (lib, test, backend)
      - name: Debug socials formatter output
        run: |
          echo "=== SOCIALS_FORMATTED_START ==="
          dart format --output=show lib/features/socials/data/repositories/socials_repository.dart
          echo "=== SOCIALS_FORMATTED_END ==="

      - name: Check Dart formatting
        run: |
          dart format lib test backend
          git diff --exit-code lib test backend || (echo "Run 'dart format lib test backend' locally before pushing" && exit 1)

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --exclude-tags integration --coverage

      - name: Check coverage threshold
        run: |
          LCOV_FILE="coverage/lcov.info"

          if [ ! -f "$LCOV_FILE" ]; then
            echo "Coverage file not found at $LCOV_FILE"
            exit 1
          fi

          # Sum up all lines found (LF) and lines hit (LH) across the report
          TOTAL_LINES=$(grep -h "^LF:" "$LCOV_FILE" | cut -d: -f2 | paste -sd+ - | bc)
          COVERED_LINES=$(grep -h "^LH:" "$LCOV_FILE" | cut -d: -f2 | paste -sd+ - | bc)

          if [ -z "$TOTAL_LINES" ] || [ -z "$COVERED_LINES" ] || [ "$TOTAL_LINES" -eq 0 ]; then
            echo "No executable lines found in coverage report. Marking coverage as 0%."
            COVERAGE=0
          else
            COVERAGE=$(awk "BEGIN { printf \"%.2f\", ($COVERED_LINES / $TOTAL_LINES) * 100 }")
          fi

          echo "Total lines:   $TOTAL_LINES"
          echo "Covered lines: $COVERED_LINES"
          echo "Coverage:      $COVERAGE%"

          # Initial minimum coverage threshold.
          # Current suite sits around ~15%, so keep the bar just below the
          # measured baseline until broader test coverage is added.
          THRESHOLD=14

          # Fail the build if coverage drops below the threshold
          if awk "BEGIN { exit !($COVERAGE < $THRESHOLD) }"; then
            echo "Coverage $COVERAGE% is below minimum threshold of ${THRESHOLD}%"
            exit 1
          fi

          echo "Coverage $COVERAGE% meets minimum threshold of ${THRESHOLD}%"

  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    if: ${{ vars.PLAYWRIGHT_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create test env
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          E2E_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          cat > .env.test <<EOF
          VITE_SUPABASE_URL=$SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          TEST_USER_EMAIL=$E2E_EMAIL
          TEST_USER_PASSWORD=$E2E_PASSWORD
          EOF

      - name: Run Playwright tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
