<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — EchoMirror</title>
    <meta name="theme-color" content="#4f46e5" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #ffffff;
        color: #1f2937;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0f1a;
          color: #e5e7eb;
        }
        .card {
          background: #111827;
          border-color: #1f2937;
        }
        .icon {
          background: #1e1b4b;
        }
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 40px 32px;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #eef2ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: inherit;
        opacity: 0.75;
        margin: 0 0 24px;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        background: #4f46e5;
        cursor: pointer;
      }
      button:hover {
        background: #4338ca;
      }
      button:active {
        background: #3730a3;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>You're offline</h1>
      <p>
        EchoMirror can't reach the network right now. Check your connection
        and try again — anything you've already logged is safe.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
